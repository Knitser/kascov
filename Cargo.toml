[workspace]
resolver = "2"
members = ["crates/kascov-decode", "crates/kascov-decode-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Knitser/kascov"
homepage = "https://kascov.io"

[workspace.dependencies]
blake2b_simd = "1"
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
